
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Presenter Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        h1 {
            text-align: center;
        }

        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

            body.dark-mode {
                background-color: #121212;
                color: #e0e0e0;
            }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }


        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        body.dark-mode .gallery-item {
            background-color: #333;
            border-color: #555;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .gallery-item span {
            font-size: 0.8em;
            word-break: break-all;
            display: block;
        }

        .preview-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            touch-action: none; /* Prevent scrolling while interacting with previews */
        }

        .preview-box {
            position: relative;
            width: 50%;
            min-height: 100px;
            background-color: #000;
            outline: 2px solid #ccc; /* Use outline instead of border to keep coordinate math clean */
            outline-offset: -2px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark-mode .preview-box {
            outline-color: #555;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }


        .controls, .pdf-controls, .upload, .scroll-controls, .camera-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        #camera-preview-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #camera-video {
            width: 100%;
            max-width: 500px;
            background: #000;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 150px;
            margin: auto;
        }

        .d-pad button {
            padding: 10px;
        }

        button {
            padding: 10px;
            font-size: 1em;
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode button {
            background-color: #333;
            color: #e0e0e0;
            border-color: #555;
        }

        .button-disabled {
            opacity: 0.5;
        }

        .pdf-page-selector {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #txtRemoteCurrentPage {
            width: 50px;
            text-align: center;
            font-size: 1.1em;
            margin: 0 5px;
        }

        #lblRemoteTotalPages {
            font-size: 1.1em;
            margin-left: 5px;
        }

        #theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .message-box {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.dark-mode .message-box {
            background-color: #333;
            border-top-color: #555;
        }

        .message-box span {
            flex-grow: 1;
        }

        #message-okay-btn {
            margin-left: 10px;
        }

            .message-box.error {
                color: red;
            }

            .message-box.warning {
                color: orange;
            }

            .message-box.info {
                color: blue;
            }

        @media (max-width: 768px) {
            .preview-container {
                flex-direction: row;
            }

            .preview-box {
                width: 50%;
            }

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        .spinner-text {
            color: #333;
            margin-top: 20px;
            font-size: 1.5em;
        }

        body.dark-mode .spinner-overlay {
            background-color: rgba(0, 0, 0, 0.8);
        }

        body.dark-mode .spinner-text {
            color: #e0e0e0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Editor Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            flex-direction: column;
        }

        .modal-content {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 100%;
        }

        .modal-header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            background-color: #222;
            color: white;
        }

        .modal-footer {
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            background-color: #222;
        }
    </style>
</head>
<body>
    <div id="spinner" class="spinner-overlay">
        <img src="splash.png" alt="Loading..." style="width: 80%; max-width: 400px; margin-bottom: 20px;">
        <div class="spinner"></div>
        <div class="spinner-text">Loading...</div>
    </div>
    <div class="container">
        <button id="theme-toggle">Toggle Theme</button>
        <h1>Dreams LIVE Solutions Presenter App Remote</h1>
        <div class="preview-container">
            <div id="picSecondaryContainer" class="preview-box">
                <img id="picSecondaryPreview" src="">
            </div>
            <div id="picPreviewContainer" class="preview-box" onclick="openEditor()" style="cursor: pointer;">
                <img id="picPreview" src="">
                <!-- Persistent Staged Reference Box -->
                <div id="staged-selection-overlay" style="position: absolute; border: 6px dotted rgba(128, 128, 128, 0.8); pointer-events: none; display: none; box-sizing: border-box;"></div>
                <!-- Current Active Selection Box -->
                <div id="selection-overlay" style="position: absolute; border: 2px solid red; pointer-events: none; display: none; box-sizing: border-box;"></div>
            </div>
        </div>
        <div class="controls">
            <button id="btnStageContent" onclick="performAction('stage')">Stage Preview</button>
            <button id="btnPushToPresenter" onclick="performAction('push')">Go Live</button>
            <button id="btnEditCrop" onclick="openEditor()" style="display: none;">Edit / Crop</button>
            <button id="btnClearPresenterDisplay" onclick="performAction('blackout')">Blackout</button>
            <button id="btnCloseLivePresenter" onclick="performAction('close')">Close Live</button>
            <button id="btnOpenSettings" onclick="toggleSettings()">Scroll Settings</button>
        </div>

        <div id="scroll-controls-section" class="scroll-controls">
            <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">
                <label>
                    <input type="checkbox" id="chkEnableScroll" onchange="updateScrollSettings({enableScroll: this.checked})">
                    Enable Auto Scroll
                </label>
                <div class="d-pad">
                    <button onclick="moveSelection(0, -1, true)">PgUp</button>
                    <button onclick="moveSelection(0, -1)">↑</button>
                    <div></div>
                    <button onclick="moveSelection(-1, 0)">←</button>
                    <button onclick="moveSelection(0, 1)">↓</button>
                    <button onclick="moveSelection(1, 0)">→</button>
                    <button onclick="moveSelection(0, 1, true)">PgDn</button>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <div class="pdf-controls" style="display: none;">
            <button id="btnPdfPrev" onclick="performAction('pdf-prev')">Prev</button>
            <div class="pdf-page-selector">
                <input type="text" id="txtRemoteCurrentPage" />
                <span id="lblRemoteTotalPages"></span>
            </div>
            <button id="btnPdfNext" onclick="performAction('pdf-next')">Next</button>
        </div>

        <div class="camera-controls">
            <button id="btnToggleCamera" onclick="toggleCamera()">Open Camera</button>
        </div>

        <div id="camera-preview-container">
            <video id="camera-video" autoplay playsinline></video>
            <button onclick="captureImage()" style="background-color: #4CAF50; color: white;">Capture</button>
        </div>

        <div class="upload">
            <input type="file" id="file-input" accept="image/*,.pdf" onchange="handleFileSelect()">
            <div id="db-upload-options" style="display: none; grid-column: 1 / -1; gap: 10px; grid-template-columns: 1fr 1fr;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <select id="subfolder-select"></select>
                    <div id="new-folder-container" style="display: none; flex-direction: column; gap: 5px;">
                        <input type="text" id="new-folder-input" placeholder="New folder name">
                    </div>
                    <button id="btnToggleNewFolder" onclick="toggleNewFolderInput()" style="font-size: 0.8em; padding: 2px; min-height: 20px;">+ New Folder</button>
                </div>
                <input type="text" id="custom-filename" placeholder="Custom filename (optional)">
            </div>
            <button id="btnUpload" onclick="prepareUpload()" disabled>Upload</button>
            <div style="grid-column: 1 / -1;">
                <label>
                    <input type="checkbox" id="chkUploadToDatabase" onchange="toggleDatabaseUpload()">
                    Upload to Database
                </label>
            </div>
        </div>

        <div id="gallery-section">
            <h2>Gallery</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <select id="gallery-subfolder-select" onchange="refreshGallery()" style="flex-grow: 1;">
                    <option value="">(Root)</option>
                </select>
                <button id="btnRefreshGallery" onclick="refreshGallery()">Refresh</button>
            </div>
            <div id="gallery" class="gallery"></div>
        </div>

        <div id="message-box" class="message-box" style="display: none;">
            <span id="message-text"></span>
            <button id="message-okay-btn" onclick="clearMessage()">Okay</button>
        </div>
        <div class="settings">
            <label>
                <input type="checkbox" id="chkLinkLocalPreviewToPresenter" onchange="updateAutoSend(this)">
                Auto Send to Presenter
            </label>
        </div>
    </div>

    <!-- Choice Modal for Upload -->
    <div id="upload-choice-modal" class="modal">
        <div class="modal-header">
            <span>Upload Options</span>
        </div>
        <div class="modal-content" style="flex-direction: column; gap: 20px; color: white;">
            <p>Would you like to edit the image before uploading?</p>
            <div style="display: flex; gap: 20px;">
                <button onclick="startUploadEdit()" style="background-color: #2196F3; color: white;">Edit Before Upload</button>
                <button onclick="finishDirectUpload()" style="background-color: #4CAF50; color: white;">Upload Now</button>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="closeUploadChoice()" style="min-width: 100px;">Cancel</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-header">
            <span>Scroll Settings</span>
            <button onclick="toggleSettings()" style="background: none; border: none; color: white; font-size: 1.5em; cursor: pointer;">&times;</button>
        </div>
        <div class="modal-content" style="flex-direction: column; color: white; gap: 20px;">
            <label>
                <input type="checkbox" id="chkSkipOnePage" onchange="updateScrollSettings({skipOnePage: this.checked})">
                Skip 1 page (PDF)
            </label>
            <label>
                <input type="checkbox" id="chkTwoPagePdf" onchange="updateScrollSettings({twoPagePdf: this.checked})">
                2 page PDF
            </label>
        </div>
        <div class="modal-footer">
            <button onclick="toggleSettings()" style="min-width: 100px;">Close</button>
        </div>
    </div>

    <div id="editor-modal" class="modal">
        <div class="modal-header">
            <span id="editor-title">Edit / Crop Content</span>
            <button onclick="closeEditor(false)" style="background: none; border: none; color: white; font-size: 1.5em; cursor: pointer;">&times;</button>
        </div>
        <div class="modal-content">
            <img id="editor-image" src="">
        </div>
        <div class="modal-footer" style="flex-wrap: wrap; gap: 10px; justify-content: center;">
            <div style="display: flex; gap: 10px; align-items: center; width: 100%; justify-content: center;">
                <label style="color: white;">
                    <input type="checkbox" id="chkEnableScrollEditor" onchange="updateScrollSettings({enableScroll: this.checked})"> Auto Scroll
                </label>
                <div class="d-pad" style="width: 150px; margin: 0;">
                    <button onclick="moveSelection(0, -1, true)" style="font-size: 0.8em; padding: 5px;">PgUp</button>
                    <button onclick="moveSelection(0, -1)">↑</button>
                    <div></div>
                    <button onclick="moveSelection(-1, 0)">←</button>
                    <button onclick="moveSelection(0, 1)">↓</button>
                    <button onclick="moveSelection(1, 0)">→</button>
                    <button onclick="moveSelection(0, 1, true)" style="font-size: 0.8em; padding: 5px;">PgDn</button>
                    <div></div>
                    <div></div>
                </div>
                <button onclick="toggleSettings()" style="padding: 5px; font-size: 0.8em;">Settings</button>
            </div>
            <label style="color: white;">
                <input type="checkbox" id="chkLiveSyncEditor" onchange="toggleLiveSync()"> Live Sync
            </label>
            <label style="color: white;">
                <input type="checkbox" id="chkAutoSendEditor" onchange="updateAutoSend(this)"> Auto Send
            </label>
            <button id="btnRotateLEditor" onclick="rotateInEditor(-1)" style="font-size: 1.2em; display: none;">↺</button>
            <button id="btnRotateREditor" onclick="rotateInEditor(1)" style="font-size: 1.2em; display: none;">↻</button>
            <button id="btnPresentNow" onclick="presentNow()" style="background-color: #2196F3; color: white; min-width: 100px;">Present Now</button>
            <button id="btnDoneEditor" onclick="closeEditor(true)" style="background-color: #4CAF50; color: white; min-width: 80px;">Done</button>
            <button id="btnUploadEditor" onclick="finishUploadEditor()" style="background-color: #FF9800; color: white; min-width: 100px; display: none;">Upload Now</button>
            <button onclick="closeEditor(false)" style="min-width: 80px;">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const startTime = new Date().getTime();
        let uploadErrorLock = false;
        let isPageInputFocused = false;
        let currentPresenterAspectRatio = 16/9;
        let cropper = null;
        let isEditing = false;
        let cropDebounceTimer = null;
        let lastCropData = null;
        let lastNormalizedSelection = null;
        let stagedNormalizedSelection = null;
        let initialCropData = null;
        let lastStatusFilePath = null;
        let isCropperReady = false;
        let isInitialStatusLoad = true;
        let isUserInteractingWithCropper = false;
        let cameraStream = null;
        let pendingUploadBlob = null;
        let isUploadEditing = false;


        let secondaryPan = { x: 0, y: 0 };
        let secondaryZoom = 1.0;
        let lastTouchDist = 0;
        let lastTouchCenter = null;

        async function performAction(action) {
            await fetch(`/action/${action}`);
        }

        async function moveSelection(x, y, isShift = false) {
            await fetch(`/action/move-selection?x=${x}&y=${y}&isShift=${isShift}`);
        }

        async function updateScrollSettings(settings) {
            let query = "";
            for (let key in settings) {
                query += `${key}=${settings[key]}&`;
            }
            await fetch(`/action/update-settings?${query}`);
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
            if (modal.style.display === 'flex') {
                modal.style.zIndex = 3000; // Above editor modal
            }
        }

        async function updateAutoSend(el) {
            const val = el.checked;
            // Sync all auto-send checkboxes
            document.getElementById('chkLinkLocalPreviewToPresenter').checked = val;
            const editorChk = document.getElementById('chkAutoSendEditor');
            if (editorChk) editorChk.checked = val;
            await fetch(`/action/auto-send?enable=${val}`);
        }

        async function clearMessage() {
            uploadErrorLock = false; // Manually clearing the message unlocks it
            await fetch('/action/clear-message');
            // We don't call adjustThemeTogglePosition here, because the updateStatus loop will handle it
        }

        function showMessage(text, type) {
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');

            messageText.textContent = text;
            messageBox.className = 'message-box ' + type;
            messageBox.style.display = 'flex';
            adjustThemeTogglePosition();
        }


        async function toggleDatabaseUpload() {
            const isChecked = document.getElementById('chkUploadToDatabase').checked;
            const options = document.getElementById('db-upload-options');
            options.style.display = isChecked ? 'grid' : 'none';
            if (isChecked) {
                await populateFolderDropdowns();
            }
        }

        async function populateFolderDropdowns() {
            try {
                const response = await fetch('/database/folders');
                const folders = await response.json();

                const uploadSelect = document.getElementById('subfolder-select');
                const gallerySelect = document.getElementById('gallery-subfolder-select');

                const currentGalleryVal = gallerySelect.value;
                const currentUploadVal = uploadSelect.value;

                const optionsHtml = '<option value="">(Root)</option>' +
                    folders.map(f => `<option value="${f}">${f}</option>`).join('');

                uploadSelect.innerHTML = optionsHtml;
                gallerySelect.innerHTML = optionsHtml;

                gallerySelect.value = currentGalleryVal;
                uploadSelect.value = currentUploadVal;
            } catch (err) {
                console.error("Error populating folders:", err);
            }
        }

        async function refreshGallery() {
            console.log("refreshGallery() triggered");
            const gallery = document.getElementById('gallery');
            const subfolder = document.getElementById('gallery-subfolder-select').value;
            try {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Loading...</p>';
                const response = await fetch(`/database/gallery?subfolder=${encodeURIComponent(subfolder)}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const files = await response.json();
                gallery.innerHTML = '';
                if (files.length === 0) {
                    gallery.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No media found in database folder.</p>';
                    return;
                }
                files.forEach(f => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.onclick = async () => {
                        await performAction(`open?path=${encodeURIComponent(f.RelativePath)}&edit=true`);
                        await updateStatus();
                    };
                    const img = document.createElement('img');
                    if (f.Extension === '.pdf') {
                        img.src = 'splash.png';
                    } else {
                        img.src = `/database/file?path=${encodeURIComponent(f.RelativePath)}&t=${new Date().getTime()}`;
                    }
                    const span = document.createElement('span');
                    span.textContent = f.RelativePath;
                    item.appendChild(img);
                    item.appendChild(span);
                    gallery.appendChild(item);
                });
            } catch (err) {
                gallery.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Error: ${err.message}</p>`;
                showMessage('Failed to refresh gallery: ' + err.message, 'error');
            }
        }

        function toggleNewFolderInput() {
            const container = document.getElementById('new-folder-container');
            const input = document.getElementById('new-folder-input');
            const btn = document.getElementById('btnToggleNewFolder');

            if (container.style.display === 'none') {
                container.style.display = 'flex';
                btn.textContent = 'x Cancel New';
                input.focus();
            } else {
                container.style.display = 'none';
                btn.textContent = '+ New Folder';
                input.value = '';
            }
        }

        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            document.getElementById('btnUpload').disabled = !fileInput.files[0];
        }

        function prepareUpload() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingUploadBlob = e.target.result;
                    document.getElementById('upload-choice-modal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            } else {
                uploadFile(file);
            }
        }

        function startUploadEdit() {
            closeUploadChoice();
            openEditor(pendingUploadBlob, true);
        }

        function finishDirectUpload() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            closeUploadChoice();

            if (file) {
                uploadFile(file);
            } else if (pendingUploadBlob) {
                // If it was a camera capture (dataURL), convert to blob
                fetch(pendingUploadBlob).then(res => res.blob()).then(blob => {
                    uploadFile(blob, 'capture.jpg');
                });
            }
        }

        function closeUploadChoice() {
            document.getElementById('upload-choice-modal').style.display = 'none';
        }

        async function finishUploadEditor() {
            if (cropper) {
                cropper.getCroppedCanvas().toBlob((blob) => {
                    const originalFile = document.getElementById('file-input').files[0];
                    let filename = 'capture.jpg';
                    if (originalFile) {
                        filename = originalFile.name;
                    }
                    uploadFile(blob, filename);
                    closeEditor(false);
                }, 'image/jpeg', 0.9);
            }
        }

        async function uploadFile(fileOrBlob, filenameHint) {
            try {
                const formData = new FormData();
                const filename = filenameHint || fileOrBlob.name || 'upload.jpg';
                console.log("Uploading file:", filename);
                formData.append('file', fileOrBlob, filename);
                const chkDb = document.getElementById('chkUploadToDatabase');
                formData.append('isDatabase', chkDb.checked);
                if (chkDb.checked) {
                    const newFolderName = document.getElementById('new-folder-input').value.trim();
                    const selectedFolder = document.getElementById('subfolder-select').value;

                    let finalSubfolder = selectedFolder;
                    if (newFolderName) {
                        finalSubfolder = selectedFolder ? (selectedFolder + '/' + newFolderName) : newFolderName;
                    }

                    formData.append('subfolder', finalSubfolder);
                    formData.append('customName', document.getElementById('custom-filename').value);
                }
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const responseData = await response.json();
                if (response.ok) {
                    uploadErrorLock = false; // Clear lock on success
                    showMessage(responseData.message, 'info');
                    document.getElementById('file-input').value = '';
                    document.getElementById('btnUpload').disabled = true;

                    if (document.getElementById('chkUploadToDatabase').checked) {
                        const subfolder = formData.get('subfolder');
                        if (subfolder) {
                            document.getElementById('gallery-subfolder-select').value = subfolder;
                        }
                        await populateFolderDropdowns();
                        await refreshGallery();
                    }
                    await updateStatus();
                } else {
                    uploadErrorLock = true; // Lock message on screen
                    showMessage(responseText, 'error');
                }
            } catch (err) {
                uploadErrorLock = true;
                showMessage('Upload failed: ' + err.message, 'error');
            }
        }

        function adjustThemeTogglePosition() {
            const themeToggle = document.getElementById('theme-toggle');
            const messageBox = document.getElementById('message-box');

            if (messageBox.style.display !== 'none') {
                const messageBoxHeight = messageBox.offsetHeight;
                themeToggle.style.bottom = `${messageBoxHeight + 20}px`;
            } else {
                themeToggle.style.bottom = '20px';
            }
        }

        async function rotateInEditor(dir) {
            if (isUploadEditing) {
                const angle = dir * 90;
                const canvas = document.createElement('canvas');
                const img = document.getElementById('editor-image');
                canvas.width = img.naturalHeight;
                canvas.height = img.naturalWidth;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(angle * Math.PI / 180);
                ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);

                const newSrc = canvas.toDataURL('image/jpeg', 0.95);
                img.src = newSrc;
                if (cropper) {
                    cropper.replace(newSrc);
                }
                return;
            }

            await fetch(`/action/rotate?dir=${dir}`);
            await updateStatus();
            const img = document.getElementById('editor-image');
            img.src = `/database/current?t=${new Date().getTime()}`;
        }

        function openEditor(imageSrc = null, isUpload = false) {
            const modal = document.getElementById('editor-modal');
            const img = document.getElementById('editor-image');
            const refOverlay = document.getElementById('editor-reference-overlay');

            if (cropper) {
                cropper.destroy();
                cropper = null;
            }

            isCropperReady = false;
            isUploadEditing = isUpload;
            img.src = imageSrc || `/database/current?t=${new Date().getTime()}`;
            modal.style.display = 'flex';
            isEditing = true;

            // Adjust buttons for upload mode
            document.getElementById('btnUploadEditor').style.display = isUpload ? 'inline-block' : 'none';
            document.getElementById('btnRotateLEditor').style.display = 'inline-block';
            document.getElementById('btnRotateREditor').style.display = 'inline-block';
            document.getElementById('btnDoneEditor').style.display = isUpload ? 'none' : 'inline-block';
            document.getElementById('btnPresentNow').style.display = isUpload ? 'none' : 'inline-block';
            const chkLive = document.getElementById('chkLiveSyncEditor');
            if (chkLive) chkLive.parentElement.style.display = isUpload ? 'none' : 'inline-block';
            const chkAuto = document.getElementById('chkAutoSendEditor');
            if (chkAuto) chkAuto.parentElement.style.display = isUpload ? 'none' : 'inline-block';
            document.getElementById('editor-title').textContent = isUpload ? 'Edit Before Upload' : 'Edit / Crop Content';

            img.onload = () => {
                // Wait for layout to settle
                setTimeout(() => {
                    if (cropper) cropper.destroy();

                    // If we have a normalized selection from host status, convert it to natural pixels for Cropper
                    if (!isUpload && lastNormalizedSelection) {
                        lastCropData = {
                            x: lastNormalizedSelection.X * img.naturalWidth,
                            y: lastNormalizedSelection.Y * img.naturalHeight,
                            width: lastNormalizedSelection.Width * img.naturalWidth,
                            height: lastNormalizedSelection.Height * img.naturalHeight,
                            rotate: 0,
                            scaleX: 1,
                            scaleY: 1
                        };
                    } else {
                        lastCropData = null;
                    }

                    // Setup reference overlay (Gray Box) using the host's actual STAGED region
                    if (!isUpload && stagedNormalizedSelection) {
                        initialCropData = {
                            x: stagedNormalizedSelection.X * img.naturalWidth,
                            y: stagedNormalizedSelection.Y * img.naturalHeight,
                            width: stagedNormalizedSelection.Width * img.naturalWidth,
                            height: stagedNormalizedSelection.Height * img.naturalHeight
                        };
                        refOverlay.style.display = 'block';
                    } else {
                        initialCropData = null;
                        refOverlay.style.display = 'none';
                    }

                    cropper = new Cropper(img, {
                        aspectRatio: currentPresenterAspectRatio,
                        viewMode: 0,
                        dragMode: 'move',
                        autoCropArea: 0.8,
                        responsive: true,
                        restore: false,
                        zoomable: true,
                        data: lastCropData,
                        ready: () => {
                            updateEditorReferenceOverlay();
                            // Delay setting ready to true to ensure initial setup events don't trigger a sync
                            setTimeout(() => { isCropperReady = true; }, 500);
                        },
                        zoom: () => {
                            setTimeout(updateEditorReferenceOverlay, 0);
                        },
                        cropstart: () => { isUserInteractingWithCropper = true; },
                        cropend: () => { isUserInteractingWithCropper = false; },
                        crop: (event) => {
                            lastCropData = event.detail;
                            updateEditorReferenceOverlay();
                            if (!isCropperReady) return;

                            // Performance: Debounce crop updates to 1 second
                            clearTimeout(cropDebounceTimer);
                            cropDebounceTimer = setTimeout(() => {
                                const imageData = cropper.getImageData();
                                syncCrop(event.detail, imageData.naturalWidth, imageData.naturalHeight);
                            }, 1000);
                        }
                    });
                }, 300);
            };
        }

        function updateEditorReferenceOverlay() {
            const refOverlay = document.getElementById('editor-reference-overlay');
            if (!cropper || !initialCropData || !isEditing) return;

            const canvasData = cropper.getCanvasData();
            const imageData = cropper.getImageData();

            // Calculate scale between natural image and current displayed image in cropper
            const scale = imageData.width / imageData.naturalWidth;

            // initialCropData is in natural pixels
            const refX = canvasData.left + (initialCropData.x * scale);
            const refY = canvasData.top + (initialCropData.y * scale);
            const refW = initialCropData.width * scale;
            const refH = initialCropData.height * scale;

            refOverlay.style.left = refX + 'px';
            refOverlay.style.top = refY + 'px';
            refOverlay.style.width = refW + 'px';
            refOverlay.style.height = refH + 'px';
        }

        async function presentNow() {
            if (cropper) {
                const detail = cropper.getData();
                const imageData = cropper.getImageData();
                // Send the crop data first
                await syncCrop(detail, imageData.naturalWidth, imageData.naturalHeight, true);
                // Then trigger the Go Live action
                await performAction('push');

                // Immediately update status to refresh the gray reference box
                await updateStatus();
            }
        }


        async function toggleLiveSync() {
            const liveSync = document.getElementById('chkLiveSyncEditor').checked;
            if (liveSync && isEditing && cropper && isCropperReady) {
                const imageData = cropper.getImageData();
                await syncCrop(cropper.getData(), imageData.naturalWidth, imageData.naturalHeight, true);
            }
        }

        async function syncCrop(detail, naturalWidth, naturalHeight, force = false) {
            const liveSyncChk = document.getElementById('chkLiveSyncEditor');
            const liveSync = liveSyncChk ? liveSyncChk.checked : false;
            if (!liveSync && !force) return;

            const x = detail.x / naturalWidth;
            const y = detail.y / naturalHeight;
            const w = detail.width / naturalWidth;
            const h = detail.height / naturalHeight;

            if (w > 0 && h > 0) {
                await fetch(`/action/remote-crop?x=${x}&y=${y}&w=${w}&h=${h}`);

                // Update local staged reference immediately after a sync completes
                initialCropData = {
                    x: detail.x,
                    y: detail.y,
                    width: detail.width,
                    height: detail.height
                };
                const refOverlay = document.getElementById('editor-reference-overlay');
                if (refOverlay) {
                    refOverlay.style.display = 'block';
                    updateEditorReferenceOverlay();
                }
            }
        }

        async function closeEditor(save) {
            const modal = document.getElementById('editor-modal');
            isEditing = false;
            modal.style.display = 'none';

            if (cropper) {
                const detail = cropper.getData();
                const imageData = cropper.getImageData();

                cropper.destroy();
                cropper = null;

                if (save) {
                    await syncCrop(detail, imageData.naturalWidth, imageData.naturalHeight, true);
                    // Explicitly clear references on host after saving a remote crop
                    await fetch('/action/stage'); // Trigger status update and reference clearing
                } else {
                    // Restore last selection on host if we cancelled but were live syncing
                    const liveSyncChk = document.getElementById('chkLiveSyncEditor');
                    if (liveSyncChk && liveSyncChk.checked && initialCropData) {
                        await syncCrop(initialCropData, imageData.naturalWidth, imageData.naturalHeight, true);
                        lastCropData = JSON.parse(JSON.stringify(initialCropData));
                    }
                }
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();

                const chkScrollEditor = document.getElementById('chkEnableScrollEditor');
                if (chkScrollEditor) chkScrollEditor.checked = status.enableScroll;

                currentPresenterAspectRatio = status.secondaryPreviewAspectRatio || (16/9);

                // Show/hide Edit button based on whether a file is loaded
                const btnEdit = document.getElementById('btnEditCrop');
                if (status.currentFilePath) {
                    btnEdit.style.display = 'inline-block';

                    // Track new file to clear last crop data, but DON'T auto-open the editor
                    if (status.currentFilePath !== lastStatusFilePath) {
                        lastStatusFilePath = status.currentFilePath;
                        lastCropData = null; // Clear crop data for new file
                    }
                } else {
                    btnEdit.style.display = 'none';
                    lastStatusFilePath = null;
                    lastCropData = null;
                }

                if (uploadErrorLock) {
                    // Don't clear a locked message
                } else if (status.message) {
                    showMessage(status.message, status.messageType);
                } else {
                    document.getElementById('message-box').style.display = 'none';
                }

                adjustThemeTogglePosition();

                // The "secondary" preview is now physically the first element
                const firstPreview = document.getElementById('picSecondaryPreview');
                firstPreview.src = status.secondaryPreview;
                if (status.secondaryPreviewAspectRatio) {
                    document.getElementById('picSecondaryContainer').style.aspectRatio = `${status.secondaryPreviewAspectRatio}`;
                }
                document.getElementById('picSecondaryContainer').style.outlineColor = status.secondaryPreviewBorderColor;

                // The "main" preview is now physically the second element
                const secondPreview = document.getElementById('picPreview');
                secondPreview.src = status.mainPreview;
                const previewContainer = document.getElementById('picPreviewContainer');
                if (status.mainPreviewAspectRatio) {
                    previewContainer.style.aspectRatio = `${status.mainPreviewAspectRatio}`;
                }

                // Active selection overlay update
                const overlay = document.getElementById('selection-overlay');
                if (status.currentSelectionNormalized) {
                    const sel = status.currentSelectionNormalized;
                    overlay.style.left = (sel.X * 100) + '%';
                    overlay.style.top = (sel.Y * 100) + '%';
                    overlay.style.width = (sel.Width * 100) + '%';
                    overlay.style.height = (sel.Height * 100) + '%';
                    overlay.style.display = 'block';

                    if (!isEditing) lastNormalizedSelection = status.currentSelectionNormalized;
                } else {
                    overlay.style.display = 'none';
                    if (!isEditing) lastNormalizedSelection = null;
                }

                // Staged reference overlay update
                const stagedOverlay = document.getElementById('staged-selection-overlay');
                if (status.stagedSelectionNormalized) {
                    const sel = status.stagedSelectionNormalized;
                    stagedOverlay.style.left = (sel.X * 100) + '%';
                    stagedOverlay.style.top = (sel.Y * 100) + '%';
                    stagedOverlay.style.width = (sel.Width * 100) + '%';
                    stagedOverlay.style.height = (sel.Height * 100) + '%';
                    stagedOverlay.style.display = 'block';

                    stagedNormalizedSelection = status.stagedSelectionNormalized;

                    // Sync editor's gray reference box if it changes while editing, but NOT during user interaction
                    if (isEditing && cropper && isCropperReady && !isUserInteractingWithCropper) {
                        const img = document.getElementById('editor-image');
                        initialCropData = {
                            x: stagedNormalizedSelection.X * img.naturalWidth,
                            y: stagedNormalizedSelection.Y * img.naturalHeight,
                            width: stagedNormalizedSelection.Width * img.naturalWidth,
                            height: stagedNormalizedSelection.Height * img.naturalHeight
                        };
                        const refOverlay = document.getElementById('editor-reference-overlay');
                        refOverlay.style.display = 'block';
                        updateEditorReferenceOverlay();
                    }
                } else {
                    stagedOverlay.style.display = 'none';
                    stagedNormalizedSelection = null;

                    // If staged is cleared on server, clear it in editor too
                    if (isEditing && !isUserInteractingWithCropper) {
                        initialCropData = null;
                        const refOverlay = document.getElementById('editor-reference-overlay');
                        refOverlay.style.display = 'none';
                    }
                }


                const pdfControls = document.querySelector('.pdf-controls');
                if (status.pdfTotalPages > 0) {
                    pdfControls.style.display = 'grid';
                    const currentPageInput = document.getElementById('txtRemoteCurrentPage');
                    if (!isPageInputFocused) {
                        currentPageInput.value = status.pdfCurrentPage + 1;
                    }
                    document.getElementById('lblRemoteTotalPages').textContent = `/ ${status.pdfTotalPages}`;
                } else {
                    pdfControls.style.display = 'none';
                }

                const autoSendDashboard = document.getElementById('chkLinkLocalPreviewToPresenter');
                if (autoSendDashboard) autoSendDashboard.checked = status.autoSend;

                const goLiveButton = document.getElementById('btnPushToPresenter');
                if (goLiveButton) {
                    goLiveButton.textContent = status.goLiveButtonText;
                    goLiveButton.classList.toggle('button-disabled', status.goLiveButtonEnabled !== true);
                }

                const closeLiveButton = document.getElementById('btnCloseLivePresenter');
                if (closeLiveButton) {
                    closeLiveButton.textContent = status.closeLiveButtonText;
                    closeLiveButton.classList.toggle('button-disabled', status.closeLiveButtonEnabled !== true);
                }

                const blackoutButton = document.getElementById('btnClearPresenterDisplay');
                if (blackoutButton) {
                    blackoutButton.textContent = status.blackoutButtonText;
                    blackoutButton.classList.toggle('button-disabled', status.blackoutButtonEnabled !== true);
                }

                const pdfPrevButton = document.getElementById('btnPdfPrev');
                if (pdfPrevButton) {
                    pdfPrevButton.classList.toggle('button-disabled', status.pdfPrevButtonEnabled !== true);
                }

                const pdfNextButton = document.getElementById('btnPdfNext');
                if (pdfNextButton) {
                    pdfNextButton.classList.toggle('button-disabled', status.pdfNextButtonEnabled !== true);
                }

                const chkScroll = document.getElementById('chkEnableScroll');
                if (chkScroll) chkScroll.checked = status.enableScroll;

                const chkSkip = document.getElementById('chkSkipOnePage');
                if (chkSkip) chkSkip.checked = status.skipOnePage;

                const chkTwo = document.getElementById('chkTwoPagePdf');
                if (chkTwo) chkTwo.checked = status.twoPagePdf;

                isInitialStatusLoad = false;
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        const pageInput = document.getElementById('txtRemoteCurrentPage');
        pageInput.addEventListener('focus', () => {
            isPageInputFocused = true;
        });
        pageInput.addEventListener('blur', () => {
            isPageInputFocused = false;
        });
        pageInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Stop default form submission
                const pageNum = parseInt(this.value, 10);
                if (!isNaN(pageNum)) {
                    performAction(`pdf-goto?page=${pageNum}`);
                    this.blur(); // Remove focus from the input
                }
            }
        });

        document.addEventListener('keydown', function (event) {
            if (isEditing || isPageInputFocused) return;

            const chkScroll = document.getElementById('chkEnableScroll');
            if (chkScroll && chkScroll.checked) {
                const isShift = event.shiftKey;
                switch (event.key) {
                    case 'ArrowUp': moveSelection(0, -1, isShift); break;
                    case 'ArrowDown': moveSelection(0, 1, isShift); break;
                    case 'ArrowLeft': moveSelection(-1, 0, isShift); break;
                    case 'ArrowRight': moveSelection(1, 0, isShift); break;
                    default: return;
                }
                event.preventDefault();
            }
        });

        async function toggleCamera() {
            const container = document.getElementById('camera-preview-container');
            const video = document.getElementById('camera-video');
            const btn = document.getElementById('btnToggleCamera');

            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                container.style.display = 'none';
                btn.textContent = 'Open Camera';
            } else {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = cameraStream;
                    container.style.display = 'flex';
                    btn.textContent = 'Close Camera';
                } catch (err) {
                    showMessage('Camera access denied or unavailable.', 'error');
                }
            }
        }

        function captureImage() {
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            pendingUploadBlob = canvas.toDataURL('image/jpeg', 0.9);
            toggleCamera(); // Stop camera
            document.getElementById('upload-choice-modal').style.display = 'flex';
        }

        setInterval(updateStatus, 1000);
        updateStatus();
        populateFolderDropdowns().then(() => refreshGallery());

        // --- Pinch-to-zoom on Staging Preview ---
        const secondaryContainer = document.getElementById('picSecondaryContainer');
        const secondaryImg = document.getElementById('picSecondaryPreview');

        secondaryContainer.onwheel = (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            secondaryZoom *= delta;
            applySecondaryTransform();
        };

        secondaryContainer.onpointerdown = (e) => {
            secondaryContainer.setPointerCapture(e.pointerId);
            lastTouchCenter = { x: e.clientX, y: e.clientY };
        };

        secondaryContainer.onpointermove = (e) => {
            if (!secondaryContainer.hasPointerCapture(e.pointerId)) return;

            const dx = e.clientX - lastTouchCenter.x;
            const dy = e.clientY - lastTouchCenter.y;

            secondaryPan.x += dx / secondaryZoom;
            secondaryPan.y += dy / secondaryZoom;

            lastTouchCenter = { x: e.clientX, y: e.clientY };
            applySecondaryTransform();
        };

        secondaryContainer.onpointerup = (e) => {
            secondaryContainer.releasePointerCapture(e.pointerId);
        };

        function applySecondaryTransform() {
            secondaryImg.style.transform = `scale(${secondaryZoom}) translate(${secondaryPan.x}px, ${secondaryPan.y}px)`;
        }

        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Apply the saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const elapsedTime = new Date().getTime() - startTime;
            const remainingTime = 2000 - elapsedTime;
            if (remainingTime > 0) {
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                }, remainingTime);
            } else {
                document.getElementById('spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
