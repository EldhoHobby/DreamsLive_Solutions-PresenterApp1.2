
<!DOCTYPE html>
<html>
<head>
    <title>Presenter Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        h1 {
            text-align: center;
        }

        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

            body.dark-mode {
                background-color: #121212;
                color: #e0e0e0;
            }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }


        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        body.dark-mode .gallery-item {
            background-color: #333;
            border-color: #555;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .gallery-item span {
            font-size: 0.8em;
            word-break: break-all;
            display: block;
        }

        .preview-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            touch-action: none; /* Prevent scrolling while interacting with previews */
        }

        .preview-box {
            position: relative;
            width: 50%;
            min-height: 100px;
            background-color: #000;
            outline: 2px solid #ccc; /* Use outline instead of border to keep coordinate math clean */
            outline-offset: -2px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark-mode .preview-box {
            outline-color: #555;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }


        .controls, .pdf-controls, .upload {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px;
            font-size: 1em;
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode button {
            background-color: #333;
            color: #e0e0e0;
            border-color: #555;
        }

        .button-disabled {
            opacity: 0.5;
        }

        .pdf-page-selector {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #txtRemoteCurrentPage {
            width: 50px;
            text-align: center;
            font-size: 1.1em;
            margin: 0 5px;
        }

        #lblRemoteTotalPages {
            font-size: 1.1em;
            margin-left: 5px;
        }

        #theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .message-box {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.dark-mode .message-box {
            background-color: #333;
            border-top-color: #555;
        }

        .message-box span {
            flex-grow: 1;
        }

        #message-okay-btn {
            margin-left: 10px;
        }

            .message-box.error {
                color: red;
            }

            .message-box.warning {
                color: orange;
            }

            .message-box.info {
                color: blue;
            }

        @media (max-width: 768px) {
            .preview-container {
                flex-direction: row;
            }

            .preview-box {
                width: 50%;
            }

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        .spinner-text {
            color: #333;
            margin-top: 20px;
            font-size: 1.5em;
        }

        body.dark-mode .spinner-overlay {
            background-color: rgba(0, 0, 0, 0.8);
        }

        body.dark-mode .spinner-text {
            color: #e0e0e0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Editor Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            flex-direction: column;
        }

        .modal-content {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 100%;
        }

        .modal-header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            background-color: #222;
            color: white;
        }

        .modal-footer {
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            background-color: #222;
        }
    </style>
</head>
<body>
    <div id="spinner" class="spinner-overlay">
        <img src="splash.png" alt="Loading..." style="width: 80%; max-width: 400px; margin-bottom: 20px;">
        <div class="spinner"></div>
        <div class="spinner-text">Loading...</div>
    </div>
    <div class="container">
        <button id="theme-toggle">Toggle Theme</button>
        <h1>Dreams LIVE Solutions Presenter App Remote</h1>
        <div class="preview-container">
            <div id="picSecondaryContainer" class="preview-box">
                <img id="picSecondaryPreview" src="">
            </div>
            <div id="picPreviewContainer" class="preview-box">
                <img id="picPreview" src="">
            </div>
        </div>
        <div class="controls">
            <button id="btnStageContent" onclick="performAction('stage')">Stage Preview</button>
            <button id="btnPushToPresenter" onclick="performAction('push')">Go Live</button>
            <button id="btnEditCrop" onclick="openEditor()" style="display: none;">Edit / Crop</button>
            <button id="btnClearPresenterDisplay" onclick="performAction('blackout')">Blackout</button>
            <button id="btnCloseLivePresenter" onclick="performAction('close')">Close Live</button>
        </div>
        <div class="pdf-controls" style="display: none;">
            <button id="btnPdfPrev" onclick="performAction('pdf-prev')">Prev</button>
            <div class="pdf-page-selector">
                <input type="text" id="txtRemoteCurrentPage" />
                <span id="lblRemoteTotalPages"></span>
            </div>
            <button id="btnPdfNext" onclick="performAction('pdf-next')">Next</button>
        </div>

        <div class="upload">
            <input type="file" id="file-input">
            <div id="db-upload-options" style="display: none; grid-column: 1 / -1; gap: 10px; grid-template-columns: 1fr 1fr;">
                <select id="subfolder-select"></select>
                <input type="text" id="custom-filename" placeholder="Custom filename (optional)">
            </div>
            <button onclick="uploadFile()">Upload</button>
            <div style="grid-column: 1 / -1;">
                <label>
                    <input type="checkbox" id="chkUploadToDatabase" onchange="toggleDatabaseUpload()">
                    Upload to Database
                </label>
            </div>
        </div>

        <div id="gallery-section">
            <h2>Gallery</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <select id="gallery-subfolder-select" onchange="refreshGallery()" style="flex-grow: 1;">
                    <option value="">(Root)</option>
                </select>
                <button id="btnRefreshGallery" onclick="refreshGallery()">Refresh</button>
            </div>
            <div id="gallery" class="gallery"></div>
        </div>

        <div id="message-box" class="message-box" style="display: none;">
            <span id="message-text"></span>
            <button id="message-okay-btn" onclick="clearMessage()">Okay</button>
        </div>
        <div class="settings">
            <label>
                <input type="checkbox" id="chkLinkLocalPreviewToPresenter" onchange="updateAutoSend()">
                Auto Send to Presenter
            </label>
        </div>
    </div>

    <!-- Editor Modal -->
    <div id="editor-modal" class="modal">
        <div class="modal-header">
            <span>Edit / Crop Content</span>
            <button onclick="closeEditor()" style="background: none; border: none; color: white; font-size: 1.5em; cursor: pointer;">&times;</button>
        </div>
        <div class="modal-content">
            <img id="editor-image" src="">
        </div>
        <div class="modal-footer">
            <label style="color: white; margin-right: 15px;">
                <input type="checkbox" id="chkLiveSyncEditor" onchange="toggleLiveSync()"> Live Sync
            </label>
            <button onclick="rotateInEditor(-1)">Rot L</button>
            <button onclick="rotateInEditor(1)">Rot R</button>
            <button onclick="closeEditor()" style="background-color: #4CAF50; color: white;">Done</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const startTime = new Date().getTime();
        let uploadErrorLock = false;
        let isPageInputFocused = false;
        let currentPresenterAspectRatio = 16/9;
        let cropper = null;
        let isEditing = false;
        let lastSyncTime = 0;
        let lastCropData = null;
        let lastStatusFilePath = null;
        let isCropperReady = false;
        let isInitialStatusLoad = true;

        // Interactive Preview State
        let isDrawing = false;
        let drawStart = null;
        let currentSelection = null; // {x, y, w, h} normalized

        let secondaryPan = { x: 0, y: 0 };
        let secondaryZoom = 1.0;
        let lastTouchDist = 0;
        let lastTouchCenter = null;

        async function performAction(action) {
            await fetch(`/action/${action}`);
        }

        async function updateAutoSend() {
            const checkbox = document.getElementById('chkLinkLocalPreviewToPresenter');
            await fetch(`/action/auto-send?enable=${checkbox.checked}`);
        }

        async function clearMessage() {
            uploadErrorLock = false; // Manually clearing the message unlocks it
            await fetch('/action/clear-message');
            // We don't call adjustThemeTogglePosition here, because the updateStatus loop will handle it
        }

        function showMessage(text, type) {
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');

            messageText.textContent = text;
            messageBox.className = 'message-box ' + type;
            messageBox.style.display = 'flex';
            adjustThemeTogglePosition();
        }


        async function toggleDatabaseUpload() {
            const isChecked = document.getElementById('chkUploadToDatabase').checked;
            const options = document.getElementById('db-upload-options');
            options.style.display = isChecked ? 'grid' : 'none';
            if (isChecked) {
                await populateFolderDropdowns();
            }
        }

        async function populateFolderDropdowns() {
            try {
                const response = await fetch('/database/folders');
                const folders = await response.json();

                const uploadSelect = document.getElementById('subfolder-select');
                const gallerySelect = document.getElementById('gallery-subfolder-select');

                const currentGalleryVal = gallerySelect.value;
                const currentUploadVal = uploadSelect.value;

                const optionsHtml = '<option value="">(Root)</option>' +
                    folders.map(f => `<option value="${f}">${f}</option>`).join('');

                uploadSelect.innerHTML = optionsHtml;
                gallerySelect.innerHTML = optionsHtml;

                gallerySelect.value = currentGalleryVal;
                uploadSelect.value = currentUploadVal;
            } catch (err) {
                console.error("Error populating folders:", err);
            }
        }

        async function refreshGallery() {
            console.log("refreshGallery() triggered");
            const gallery = document.getElementById('gallery');
            const subfolder = document.getElementById('gallery-subfolder-select').value;
            try {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Loading...</p>';
                const response = await fetch(`/database/gallery?subfolder=${encodeURIComponent(subfolder)}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const files = await response.json();
                gallery.innerHTML = '';
                if (files.length === 0) {
                    gallery.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No media found in database folder.</p>';
                    return;
                }
                files.forEach(f => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.onclick = async () => {
                        await performAction(`open?path=${encodeURIComponent(f.RelativePath)}&edit=true`);
                    };
                    const img = document.createElement('img');
                    if (f.Extension === '.pdf') {
                        img.src = 'splash.png';
                    } else {
                        img.src = `/database/file?path=${encodeURIComponent(f.RelativePath)}&t=${new Date().getTime()}`;
                    }
                    const span = document.createElement('span');
                    span.textContent = f.RelativePath;
                    item.appendChild(img);
                    item.appendChild(span);
                    gallery.appendChild(item);
                });
            } catch (err) {
                gallery.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Error: ${err.message}</p>`;
                showMessage('Failed to refresh gallery: ' + err.message, 'error');
            }
        }

        async function uploadFile() {

            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) {
                uploadErrorLock = true;
                showMessage('Please select a file first.', 'warning');
                return;
            }


            try {
                const formData = new FormData();
                formData.append('file', file, file.name);
                const chkDb = document.getElementById('chkUploadToDatabase');
                formData.append('isDatabase', chkDb.checked);
                if (chkDb.checked) {
                    formData.append('subfolder', document.getElementById('subfolder-select').value);
                    formData.append('customName', document.getElementById('custom-filename').value);
                }
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const responseText = await response.text();
                if (response.ok) {
                    uploadErrorLock = false; // Clear lock on success
                    showMessage(responseText, 'info');
                    fileInput.value = ''; // Clear the input
                    if (document.getElementById('chkUploadToDatabase').checked) refreshGallery();
                } else {
                    uploadErrorLock = true; // Lock message on screen
                    showMessage(responseText, 'error');
                }
            } catch (err) {
                uploadErrorLock = true;
                showMessage('Upload failed: ' + err.message, 'error');
            }
        }

        function adjustThemeTogglePosition() {
            const themeToggle = document.getElementById('theme-toggle');
            const messageBox = document.getElementById('message-box');

            if (messageBox.style.display !== 'none') {
                const messageBoxHeight = messageBox.offsetHeight;
                themeToggle.style.bottom = `${messageBoxHeight + 20}px`;
            } else {
                themeToggle.style.bottom = '20px';
            }
        }

        async function rotateInEditor(dir) {
            await performAction(`rotate?dir=${dir}`);
            // Wait a bit for the host to process rotation, then reload the image in editor
            setTimeout(() => {
                const img = document.getElementById('editor-image');
                img.src = `/database/current?t=${new Date().getTime()}`;
                // Cropper will be re-initialized by img.onload in openEditor if it was already open
            }, 200);
        }

        function openEditor() {
            const modal = document.getElementById('editor-modal');
            const img = document.getElementById('editor-image');

            if (cropper) {
                cropper.destroy();
                cropper = null;
            }

            isCropperReady = false;
            img.src = `/database/current?t=${new Date().getTime()}`;
            modal.style.display = 'flex';
            isEditing = true;

            img.onload = () => {
                // Wait for layout to settle
                setTimeout(() => {
                    if (cropper) cropper.destroy();

                    cropper = new Cropper(img, {
                        aspectRatio: currentPresenterAspectRatio,
                        viewMode: 1,
                        autoCropArea: 1,
                        responsive: true,
                        restore: false,
                        zoomable: true,
                        data: lastCropData,
                        ready: () => {
                            isCropperReady = true;
                            if (lastCropData) {
                                const imageData = cropper.getImageData();
                                syncCrop(cropper.getData(), imageData.naturalWidth, imageData.naturalHeight, true);
                            }
                        },
                        crop: (event) => {
                            lastCropData = event.detail;
                            if (!isCropperReady) return;

                            const now = Date.now();
                            if (now - lastSyncTime > 100) {
                                const imageData = cropper.getImageData();
                                syncCrop(event.detail, imageData.naturalWidth, imageData.naturalHeight);
                                lastSyncTime = now;
                            }
                        }
                    });
                }, 300);
            };
        }

        async function toggleLiveSync() {
            const liveSync = document.getElementById('chkLiveSyncEditor').checked;
            if (liveSync && isEditing && cropper && isCropperReady) {
                const imageData = cropper.getImageData();
                await syncCrop(cropper.getData(), imageData.naturalWidth, imageData.naturalHeight, true);
            }
        }

        async function syncCrop(detail, naturalWidth, naturalHeight, force = false) {
            const liveSync = document.getElementById('chkLiveSyncEditor').checked;
            if (!liveSync && !force) return;

            const x = detail.x / naturalWidth;
            const y = detail.y / naturalHeight;
            const w = detail.width / naturalWidth;
            const h = detail.height / naturalHeight;

            if (w > 0 && h > 0) {
                await fetch(`/action/remote-crop?x=${x}&y=${y}&w=${w}&h=${h}`);
            }
        }

        async function closeEditor() {
            const modal = document.getElementById('editor-modal');
            isEditing = false;
            modal.style.display = 'none';

            if (cropper) {
                const detail = cropper.getData();
                const imageData = cropper.getImageData();

                cropper.destroy();
                cropper = null;

                await syncCrop(detail, imageData.naturalWidth, imageData.naturalHeight, true);
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();

                currentPresenterAspectRatio = status.secondaryPreviewAspectRatio || (16/9);

                // Show/hide Edit button based on whether a file is loaded
                const btnEdit = document.getElementById('btnEditCrop');
                if (status.currentFilePath) {
                    btnEdit.style.display = 'inline-block';

                    // Track new file to clear last crop data, but DON'T auto-open the editor
                    if (status.currentFilePath !== lastStatusFilePath) {
                        lastStatusFilePath = status.currentFilePath;
                        lastCropData = null; // Clear crop data for new file
                    }
                } else {
                    btnEdit.style.display = 'none';
                    lastStatusFilePath = null;
                    lastCropData = null;
                }

                if (uploadErrorLock) {
                    // Don't clear a locked message
                } else if (status.message) {
                    showMessage(status.message, status.messageType);
                } else {
                    document.getElementById('message-box').style.display = 'none';
                }

                adjustThemeTogglePosition();

                // The "secondary" preview is now physically the first element
                const firstPreview = document.getElementById('picSecondaryPreview');
                firstPreview.src = status.secondaryPreview;
                if (status.secondaryPreviewAspectRatio) {
                    document.getElementById('picSecondaryContainer').style.aspectRatio = `${status.secondaryPreviewAspectRatio}`;
                }
                document.getElementById('picSecondaryContainer').style.outlineColor = status.secondaryPreviewBorderColor;

                // The "main" preview is now physically the second element
                const secondPreview = document.getElementById('picPreview');
                secondPreview.src = status.mainPreview;
                if (status.mainPreviewAspectRatio) {
                    document.getElementById('picPreviewContainer').style.aspectRatio = `${status.mainPreviewAspectRatio}`;
                }


                const pdfControls = document.querySelector('.pdf-controls');
                if (status.pdfTotalPages > 0) {
                    pdfControls.style.display = 'grid';
                    const currentPageInput = document.getElementById('txtRemoteCurrentPage');
                    if (!isPageInputFocused) {
                        currentPageInput.value = status.pdfCurrentPage + 1;
                    }
                    document.getElementById('lblRemoteTotalPages').textContent = `/ ${status.pdfTotalPages}`;
                } else {
                    pdfControls.style.display = 'none';
                }

                const autoSendCheckbox = document.getElementById('chkLinkLocalPreviewToPresenter');
                if (autoSendCheckbox) {
                    autoSendCheckbox.checked = status.autoSend;
                }

                const goLiveButton = document.getElementById('btnPushToPresenter');
                if (goLiveButton) {
                    goLiveButton.textContent = status.goLiveButtonText;
                    goLiveButton.classList.toggle('button-disabled', status.goLiveButtonEnabled !== true);
                }

                const closeLiveButton = document.getElementById('btnCloseLivePresenter');
                if (closeLiveButton) {
                    closeLiveButton.textContent = status.closeLiveButtonText;
                    closeLiveButton.classList.toggle('button-disabled', status.closeLiveButtonEnabled !== true);
                }

                const blackoutButton = document.getElementById('btnClearPresenterDisplay');
                if (blackoutButton) {
                    blackoutButton.textContent = status.blackoutButtonText;
                    blackoutButton.classList.toggle('button-disabled', status.blackoutButtonEnabled !== true);
                }

                const pdfPrevButton = document.getElementById('btnPdfPrev');
                if (pdfPrevButton) {
                    pdfPrevButton.classList.toggle('button-disabled', status.pdfPrevButtonEnabled !== true);
                }

                const pdfNextButton = document.getElementById('btnPdfNext');
                if (pdfNextButton) {
                    pdfNextButton.classList.toggle('button-disabled', status.pdfNextButtonEnabled !== true);
                }

                isInitialStatusLoad = false;
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        const pageInput = document.getElementById('txtRemoteCurrentPage');
        pageInput.addEventListener('focus', () => {
            isPageInputFocused = true;
        });
        pageInput.addEventListener('blur', () => {
            isPageInputFocused = false;
        });
        pageInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Stop default form submission
                const pageNum = parseInt(this.value, 10);
                if (!isNaN(pageNum)) {
                    performAction(`pdf-goto?page=${pageNum}`);
                    this.blur(); // Remove focus from the input
                }
            }
        });

        setInterval(updateStatus, 1000);
        updateStatus();
        populateFolderDropdowns().then(() => refreshGallery());

        // --- Pinch-to-zoom on Staging Preview ---
        const secondaryContainer = document.getElementById('picSecondaryContainer');
        const secondaryImg = document.getElementById('picSecondaryPreview');

        secondaryContainer.onwheel = (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            secondaryZoom *= delta;
            applySecondaryTransform();
        };

        secondaryContainer.onpointerdown = (e) => {
            secondaryContainer.setPointerCapture(e.pointerId);
            lastTouchCenter = { x: e.clientX, y: e.clientY };
        };

        secondaryContainer.onpointermove = (e) => {
            if (!secondaryContainer.hasPointerCapture(e.pointerId)) return;

            const dx = e.clientX - lastTouchCenter.x;
            const dy = e.clientY - lastTouchCenter.y;

            secondaryPan.x += dx / secondaryZoom;
            secondaryPan.y += dy / secondaryZoom;

            lastTouchCenter = { x: e.clientX, y: e.clientY };
            applySecondaryTransform();
        };

        secondaryContainer.onpointerup = (e) => {
            secondaryContainer.releasePointerCapture(e.pointerId);
        };

        function applySecondaryTransform() {
            secondaryImg.style.transform = `scale(${secondaryZoom}) translate(${secondaryPan.x}px, ${secondaryPan.y}px)`;
        }

        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Apply the saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const elapsedTime = new Date().getTime() - startTime;
            const remainingTime = 2000 - elapsedTime;
            if (remainingTime > 0) {
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                }, remainingTime);
            } else {
                document.getElementById('spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
