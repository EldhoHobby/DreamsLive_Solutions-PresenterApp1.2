
<!DOCTYPE html>
<html>
<head>
    <title>Presenter Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1 {
            text-align: center;
        }

        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

            body.dark-mode {
                background-color: #121212;
                color: #e0e0e0;
            }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .preview {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        #camera-video, #editor-canvas {
            width: 100%;
            max-height: 70vh;
            background-color: #000;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255,255,255,0.5);
            pointer-events: none;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-overlay::after {
            content: 'PRESENTER AREA';
            color: rgba(255,255,255,0.5);
            font-size: 0.8em;
        }

        .modal-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .modal-controls button {
            min-width: 80px;
        }

            .preview img {
                border: 5px solid #ccc; /* Thicker border */
                width: 50%;
                object-fit: contain;
                background-color: #000;
                box-sizing: border-box; /* Include border in width calculation */
            }

        body.dark-mode .preview img {
            border-color: #555;
        }

        .controls, .pdf-controls, .upload, .database-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        body.dark-mode .gallery-item {
            background-color: #333;
            border-color: #555;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .gallery-item span {
            font-size: 0.8em;
            word-break: break-all;
            display: block;
        }

        button {
            padding: 10px;
            font-size: 1em;
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode button {
            background-color: #333;
            color: #e0e0e0;
            border-color: #555;
        }

        .button-disabled {
            opacity: 0.5;
        }

        .pdf-page-selector {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #txtRemoteCurrentPage {
            width: 50px;
            text-align: center;
            font-size: 1.1em;
            margin: 0 5px;
        }

        #lblRemoteTotalPages {
            font-size: 1.1em;
            margin-left: 5px;
        }

        #theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .message-box {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.dark-mode .message-box {
            background-color: #333;
            border-top-color: #555;
        }

        .message-box span {
            flex-grow: 1;
        }

        #message-okay-btn {
            margin-left: 10px;
        }

            .message-box.error {
                color: red;
            }

            .message-box.warning {
                color: orange;
            }

            .message-box.info {
                color: blue;
            }

        @media (max-width: 768px) {
            .preview {
                flex-direction: row;
            }

                .preview img {
                    width: 50%;
                }

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        .spinner-text {
            color: #333;
            margin-top: 20px;
            font-size: 1.5em;
        }

        body.dark-mode .spinner-overlay {
            background-color: rgba(0, 0, 0, 0.8);
        }

        body.dark-mode .spinner-text {
            color: #e0e0e0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="spinner" class="spinner-overlay">
        <img src="splash.png" alt="Loading..." style="width: 80%; max-width: 400px; margin-bottom: 20px;">
        <div class="spinner"></div>
        <div class="spinner-text">Loading...</div>
    </div>
    <div class="container">
        <button id="theme-toggle">Toggle Theme</button>
        <h1>Dreams LIVE Solutions Presenter App Remote</h1>
        <div class="preview">
            <img id="picSecondaryPreview" src="">
            <img id="picPreview" src="">
        </div>
        <div class="controls">
            <button id="btnStageContent" onclick="performAction('stage')">Stage Preview</button>
            <button id="btnPushToPresenter" onclick="performAction('push')">Go Live</button>
            <button id="btnClearPresenterDisplay" onclick="performAction('blackout')">Blackout</button>
            <button id="btnCloseLivePresenter" onclick="performAction('close')">Close Live</button>
        </div>
        <div class="pdf-controls" style="display: none;">
            <button id="btnPdfPrev" onclick="performAction('pdf-prev')">Prev</button>
            <div class="pdf-page-selector">
                <input type="text" id="txtRemoteCurrentPage" />
                <span id="lblRemoteTotalPages"></span>
            </div>
            <button id="btnPdfNext" onclick="performAction('pdf-next')">Next</button>
        </div>
        <div class="upload">
            <div style="grid-column: 1 / -1; display: flex; gap: 10px;">
                <input type="file" id="file-input" style="flex-grow: 1;" onchange="handleFileSelect(event)">
                <button onclick="startCamera()">📷 Camera</button>
            </div>
            <div id="db-upload-options" style="display: none; grid-column: 1 / -1; gap: 10px; grid-template-columns: 1fr 1fr;">
                <select id="subfolder-select"></select>
                <input type="text" id="custom-filename" placeholder="Custom filename (optional)">
            </div>
            <button id="btnUpload" onclick="uploadFile()">Upload</button>
            <div style="grid-column: 1 / -1;">
                <label>
                    <input type="checkbox" id="chkUploadToDatabase" onchange="toggleDatabaseUpload()">
                    Upload to Database
                </label>
            </div>
        </div>

        <div id="gallery-section">
            <h2>Gallery</h2>
            <button onclick="refreshGallery()">Refresh Gallery</button>
            <div id="gallery" class="gallery"></div>
        </div>

        <div id="camera-modal" class="modal">
            <div class="modal-content">
                <video id="camera-video" autoplay playsinline></video>
                <div id="camera-overlay" class="camera-overlay"></div>
            </div>
            <div class="modal-controls">
                <button onclick="capturePhoto()">📸 Capture</button>
                <button onclick="stopCamera()">Cancel</button>
            </div>
        </div>

        <div id="editor-modal" class="modal">
            <div class="modal-content">
                <canvas id="editor-canvas"></canvas>
                <div id="editor-overlay" class="camera-overlay"></div>
            </div>
            <div class="modal-controls">
                <button onclick="rotateImage()">🔄 Rotate</button>
                <button onclick="zoomImage(1.2)">➕ Zoom In</button>
                <button onclick="zoomImage(0.8)">➖ Zoom Out</button>
                <button onclick="resetEditor()">Reset</button>
                <button id="btnEditorUpload" onclick="uploadProcessedImage()" style="background-color: #2ecc71; color: white;">Confirm & Upload</button>
                <button onclick="closeEditor()">Cancel</button>
            </div>
            <p style="color: white; font-size: 0.8em; margin-top: 5px;">Drag to pan</p>
        </div>

        <div id="message-box" class="message-box" style="display: none;">
            <span id="message-text"></span>
            <button id="message-okay-btn" onclick="clearMessage()">Okay</button>
        </div>
        <div class="settings">
            <label>
                <input type="checkbox" id="chkLinkLocalPreviewToPresenter" onchange="updateAutoSend()">
                Auto Send to Presenter
            </label>
        </div>
    </div>
    <script>
        const startTime = new Date().getTime();
        let uploadErrorLock = false;
        let isPageInputFocused = false;

        // Editor state
        let editorImg = new Image();
        let editorRotation = 0;
        let editorScale = 1;
        let editorPanX = 0;
        let editorPanY = 0;
        let currentPresenterAspectRatio = 1.6; // Default fallback
        let isPanningEditor = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        async function performAction(action) {
            await fetch(`/action/${action}`);
        }

        async function updateAutoSend() {
            const checkbox = document.getElementById('chkLinkLocalPreviewToPresenter');
            await fetch(`/action/auto-send?enable=${checkbox.checked}`);
        }

        async function clearMessage() {
            uploadErrorLock = false; // Manually clearing the message unlocks it
            await fetch('/action/clear-message');
            // We don't call adjustThemeTogglePosition here, because the updateStatus loop will handle it
        }

        function showMessage(text, type) {
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');

            messageText.textContent = text;
            messageBox.className = 'message-box ' + type;
            messageBox.style.display = 'flex';
            adjustThemeTogglePosition();
        }

        async function toggleDatabaseUpload() {
            const isChecked = document.getElementById('chkUploadToDatabase').checked;
            const options = document.getElementById('db-upload-options');
            options.style.display = isChecked ? 'grid' : 'none';
            if (isChecked) {
                const response = await fetch('/database/folders');
                const folders = await response.json();
                const select = document.getElementById('subfolder-select');
                select.innerHTML = '<option value="">(Root)</option>';
                folders.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    select.appendChild(opt);
                });
            }
        }

        async function refreshGallery() {
            const response = await fetch('/database/gallery');
            const files = await response.json();
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            files.forEach(f => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => performAction(`open?path=${encodeURIComponent(f.RelativePath)}`);

                const img = document.createElement('img');
                if (f.Extension === '.pdf') {
                    img.src = 'splash.png'; // Placeholder for PDFs
                } else {
                    img.src = `/database/file?path=${encodeURIComponent(f.RelativePath)}`;
                }

                const span = document.createElement('span');
                span.textContent = f.RelativePath;

                item.appendChild(img);
                item.appendChild(span);
                gallery.appendChild(item);
            });
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) {
                uploadErrorLock = true;
                showMessage('Please select a file first.', 'warning');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('file', file, file.name);

                const chkDb = document.getElementById('chkUploadToDatabase');
                if (chkDb.checked) {
                    formData.append('subfolder', document.getElementById('subfolder-select').value);
                    formData.append('customName', document.getElementById('custom-filename').value);
                }

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const responseText = await response.text();
                if (response.ok) {
                    uploadErrorLock = false; // Clear lock on success
                    showMessage(responseText, 'info');
                    fileInput.value = ''; // Clear the input
                    if (chkDb.checked) refreshGallery();
                } else {
                    uploadErrorLock = true; // Lock message on screen
                    showMessage(responseText, 'error');
                }
            } catch (err) {
                uploadErrorLock = true;
                showMessage('Upload failed: ' + err.message, 'error');
            }
        }

        function adjustThemeTogglePosition() {
            const themeToggle = document.getElementById('theme-toggle');
            const messageBox = document.getElementById('message-box');

            if (messageBox.style.display !== 'none') {
                const messageBoxHeight = messageBox.offsetHeight;
                themeToggle.style.bottom = `${messageBoxHeight + 20}px`;
            } else {
                themeToggle.style.bottom = '20px';
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();

                currentPresenterAspectRatio = status.secondaryPreviewAspectRatio || 1.6;
                updateOverlayBoxes();

                if (uploadErrorLock) {
                    // Don't clear a locked message
                } else if (status.message) {
                    showMessage(status.message, status.messageType);
                } else {
                    document.getElementById('message-box').style.display = 'none';
                }

                adjustThemeTogglePosition();

                // The "secondary" preview is now physically the first element
                const firstPreview = document.getElementById('picSecondaryPreview');
                firstPreview.src = status.secondaryPreview;
                firstPreview.style.aspectRatio = status.secondaryPreviewAspectRatio;
                firstPreview.style.borderColor = status.secondaryPreviewBorderColor;

                // The "main" preview is now physically the second element
                const secondPreview = document.getElementById('picPreview');
                secondPreview.src = status.mainPreview;
                secondPreview.style.aspectRatio = status.mainPreviewAspectRatio;

                const pdfControls = document.querySelector('.pdf-controls');
                if (status.pdfTotalPages > 0) {
                    pdfControls.style.display = 'grid';
                    const currentPageInput = document.getElementById('txtRemoteCurrentPage');
                    if (!isPageInputFocused) {
                        currentPageInput.value = status.pdfCurrentPage + 1;
                    }
                    document.getElementById('lblRemoteTotalPages').textContent = `/ ${status.pdfTotalPages}`;
                } else {
                    pdfControls.style.display = 'none';
                }

                const autoSendCheckbox = document.getElementById('chkLinkLocalPreviewToPresenter');
                if (autoSendCheckbox) {
                    autoSendCheckbox.checked = status.autoSend;
                }

                const goLiveButton = document.getElementById('btnPushToPresenter');
                if (goLiveButton) {
                    goLiveButton.textContent = status.goLiveButtonText;
                    goLiveButton.classList.toggle('button-disabled', status.goLiveButtonEnabled !== true);
                }

                const closeLiveButton = document.getElementById('btnCloseLivePresenter');
                if (closeLiveButton) {
                    closeLiveButton.textContent = status.closeLiveButtonText;
                    closeLiveButton.classList.toggle('button-disabled', status.closeLiveButtonEnabled !== true);
                }

                const blackoutButton = document.getElementById('btnClearPresenterDisplay');
                if (blackoutButton) {
                    blackoutButton.textContent = status.blackoutButtonText;
                    blackoutButton.classList.toggle('button-disabled', status.blackoutButtonEnabled !== true);
                }

                const pdfPrevButton = document.getElementById('btnPdfPrev');
                if (pdfPrevButton) {
                    pdfPrevButton.classList.toggle('button-disabled', status.pdfPrevButtonEnabled !== true);
                }

                const pdfNextButton = document.getElementById('btnPdfNext');
                if (pdfNextButton) {
                    pdfNextButton.classList.toggle('button-disabled', status.pdfNextButtonEnabled !== true);
                }
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        const pageInput = document.getElementById('txtRemoteCurrentPage');
        pageInput.addEventListener('focus', () => {
            isPageInputFocused = true;
        });
        pageInput.addEventListener('blur', () => {
            isPageInputFocused = false;
        });
        pageInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Stop default form submission
                const pageNum = parseInt(this.value, 10);
                if (!isNaN(pageNum)) {
                    performAction(`pdf-goto?page=${pageNum}`);
                    this.blur(); // Remove focus from the input
                }
            }
        });

        // Camera functions
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('camera-video');
                video.srcObject = stream;
                document.getElementById('camera-modal').style.display = 'flex';
                updateOverlayBoxes();
            } catch (err) {
                showMessage('Could not access camera: ' + err.message, 'error');
            }
        }

        function stopCamera() {
            const video = document.getElementById('camera-video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-modal').style.display = 'none';
        }

        function capturePhoto() {
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            stopCamera();
            openEditor(canvas.toDataURL('image/png'));
        }

        // Editor functions
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => openEditor(e.target.result);
                reader.readAsDataURL(file);
            }
        }

        function openEditor(imageSrc) {
            editorImg = new Image();
            editorImg.onload = () => {
                resetEditor();
                document.getElementById('editor-modal').style.display = 'flex';
                renderEditor();
            };
            editorImg.src = imageSrc;
        }

        function resetEditor() {
            editorRotation = 0;
            editorScale = 1;
            editorPanX = 0;
            editorPanY = 0;
            renderEditor();
        }

        function closeEditor() {
            document.getElementById('editor-modal').style.display = 'none';
            document.getElementById('file-input').value = '';
        }

        function rotateImage() {
            editorRotation = (editorRotation + 90) % 360;
            renderEditor();
        }

        function zoomImage(factor) {
            editorScale *= factor;
            renderEditor();
        }

        function updateOverlayBoxes() {
            const boxes = [document.getElementById('camera-overlay'), document.getElementById('editor-overlay')];
            boxes.forEach(box => {
                if (!box) return;
                const parent = box.parentElement;
                const pWidth = parent.clientWidth;
                const pHeight = parent.clientHeight;

                let w = pWidth;
                let h = w / currentPresenterAspectRatio;

                if (h > pHeight) {
                    h = pHeight;
                    w = h * currentPresenterAspectRatio;
                }

                box.style.width = w + 'px';
                box.style.height = h + 'px';
                box.style.top = (pHeight - h) / 2 + 'px';
                box.style.left = (pWidth - w) / 2 + 'px';
            });
        }

        function renderEditor() {
            const canvas = document.getElementById('editor-canvas');
            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;

            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.translate(canvas.width / 2 + editorPanX, canvas.height / 2 + editorPanY);
            ctx.rotate((editorRotation * Math.PI) / 180);
            ctx.scale(editorScale, editorScale);

            const drawW = editorImg.width;
            const drawH = editorImg.height;

            // Initial fit
            const fitScale = Math.min(canvas.width / drawW, canvas.height / drawH) * 0.8;
            ctx.drawImage(editorImg, -drawW / 2 * fitScale, -drawH / 2 * fitScale, drawW * fitScale, drawH * fitScale);

            ctx.restore();
            updateOverlayBoxes();
        }

        // Panning in Editor
        const editorCanvas = document.getElementById('editor-canvas');
        editorCanvas.addEventListener('mousedown', (e) => { isPanningEditor = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        editorCanvas.addEventListener('touchstart', (e) => { isPanningEditor = true; lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY; });

        window.addEventListener('mousemove', (e) => {
            if (isPanningEditor) {
                editorPanX += e.clientX - lastMouseX;
                editorPanY += e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                renderEditor();
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (isPanningEditor) {
                editorPanX += e.touches[0].clientX - lastMouseX;
                editorPanY += e.touches[0].clientY - lastMouseY;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                renderEditor();
            }
        });
        window.addEventListener('mouseup', () => isPanningEditor = false);
        window.addEventListener('touchend', () => isPanningEditor = false);

        async function uploadProcessedImage() {
            const canvas = document.createElement('canvas');
            const overlay = document.getElementById('editor-overlay');
            const rect = overlay.getBoundingClientRect();
            const canvasRect = document.getElementById('editor-canvas').getBoundingClientRect();

            // We want the output to be high res, let's target 1920 width or proportional
            const outputWidth = 1920;
            const outputHeight = outputWidth / currentPresenterAspectRatio;

            canvas.width = outputWidth;
            canvas.height = outputHeight;
            const ctx = canvas.getContext('2d');

            // Map the area inside the overlay to the output canvas
            const mainCanvas = document.getElementById('editor-canvas');

            // To get high quality, we'll re-render the original image onto the output canvas
            // with the same transformations but scaled to output resolution
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            // Calculate how the pan/scale on screen translates to the output
            // Overlay size on screen
            const ovW = parseFloat(overlay.style.width);
            const ovH = parseFloat(overlay.style.height);

            const screenToOutputScale = outputWidth / ovW;

            ctx.rotate((editorRotation * Math.PI) / 180);

            // The editor scale is relative to the "fit" size in the editor
            const fitScale = Math.min(mainCanvas.width / editorImg.width, mainCanvas.height / editorImg.height) * 0.8;
            const finalScale = editorScale * fitScale * screenToOutputScale;

            ctx.scale(finalScale, finalScale);

            // Pan values are in screen pixels, need to scale to output and account for center translation
            ctx.drawImage(editorImg, (editorPanX * screenToOutputScale) / finalScale - editorImg.width/2, (editorPanY * screenToOutputScale) / finalScale - editorImg.height/2);

            ctx.restore();

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                const filename = (document.getElementById('custom-filename').value || 'captured_image') + '.png';
                formData.append('file', blob, filename);

                const chkDb = document.getElementById('chkUploadToDatabase');
                if (chkDb.checked) {
                    formData.append('subfolder', document.getElementById('subfolder-select').value);
                    formData.append('customName', document.getElementById('custom-filename').value);
                }

                try {
                    showMessage('Uploading processed image...', 'info');
                    const response = await fetch('/upload', { method: 'POST', body: formData });
                    const responseText = await response.text();
                    if (response.ok) {
                        showMessage(responseText, 'info');
                        closeEditor();
                        if (chkDb.checked) refreshGallery();
                    } else {
                        showMessage(responseText, 'error');
                    }
                } catch (err) {
                    showMessage('Upload failed: ' + err.message, 'error');
                }
            }, 'image/png');
        }

        setInterval(updateStatus, 1000);
        updateStatus();
        refreshGallery();

        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Apply the saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const elapsedTime = new Date().getTime() - startTime;
            const remainingTime = 2000 - elapsedTime;
            if (remainingTime > 0) {
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                }, remainingTime);
            } else {
                document.getElementById('spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
